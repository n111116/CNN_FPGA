<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <style>
      .title { font: 700 34px Arial, "Microsoft YaHei", sans-serif; fill: #17202a; }
      .subtitle { font: 18px Arial, "Microsoft YaHei", sans-serif; fill: #52616f; }
      .label { font: 700 18px Arial, "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 15px Arial, "Microsoft YaHei", sans-serif; fill: #34495e; }
      .tiny { font: 13px Arial, "Microsoft YaHei", sans-serif; fill: #52616f; }
      .formula { font: 16px Consolas, "Courier New", monospace; fill: #263238; }
      .axis { stroke: #263238; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .axis2 { stroke: #607d8b; stroke-width: 2.2; fill: none; marker-end: url(#arrow2); }
      .grid { stroke: rgba(40, 55, 71, 0.38); stroke-width: 1.1; fill: none; }
      .faceTop { fill: #b9d8ff; stroke: #3f6fa8; stroke-width: 2; }
      .faceSide { fill: #9fc7f5; stroke: #3f6fa8; stroke-width: 2; }
      .faceFront { fill: #d7e9ff; stroke: #3f6fa8; stroke-width: 2.4; }
      .page2 { fill: #b4d1f0; stroke: #5f8dbf; stroke-width: 1.6; opacity: 0.50; }
      .page1 { fill: #c7def8; stroke: #5f8dbf; stroke-width: 1.6; opacity: 0.72; }
      .peCell { fill: #ffffff; stroke: #4f79aa; stroke-width: 1.5; rx: 5; }
      .peCellAlt { fill: #eef6ff; stroke: #4f79aa; stroke-width: 1.5; rx: 5; }
      .sumBox { fill: #fff5dd; stroke: #b77a18; stroke-width: 2.1; rx: 7; }
      .outBox { fill: #e9f7ef; stroke: #2e7d55; stroke-width: 2.2; rx: 8; }
      .weightBox { fill: #f3edff; stroke: #7254a8; stroke-width: 2; rx: 8; }
      .inputBox { fill: #ffffff; stroke: #5d6d7e; stroke-width: 2; rx: 8; }
      .regBox { fill: #f8fbff; stroke: #234e70; stroke-width: 1.8; rx: 4; }
      .macBox { fill: #ffffff; stroke: #2563eb; stroke-width: 2.3; rx: 10; }
      .mulCircle { fill: #fff7ed; stroke: #b45309; stroke-width: 2; }
      .addCircle { fill: #eefbf4; stroke: #15803d; stroke-width: 2; }
      .flow { stroke: #455a64; stroke-width: 2.2; fill: none; marker-end: url(#arrow2); }
      .flowDashed { stroke: #7b8794; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow2); }
      .noteBox { fill: #ffffff; stroke: #b0bec5; stroke-width: 2; rx: 10; }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#263238"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#607d8b"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#5c6b73" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1800" height="1250" fill="#fbfcfe"/>

  <text x="70" y="70" class="title">三维 PE 脉动卷积阵列</text>
  <text x="70" y="104" class="subtitle">深度 = PE_PAGE_NUM 输入通道分页，横向 = PE_COL_NUM 输出通道列，纵向 = PE_ROW_NUM 个 KxK 乘加链</text>

  <!-- source blocks -->
  <rect x="72" y="165" width="270" height="96" class="inputBox"/>
  <text x="95" y="198" class="label">输入窗口生成</text>
  <text x="95" y="226" class="small">行缓存 + 像素缓存</text>
  <text x="95" y="249" class="tiny">串行特征流 -> KxK 窗口</text>

  <rect x="72" y="300" width="270" height="96" class="weightBox"/>
  <text x="95" y="333" class="label">权重管理</text>
  <text x="95" y="361" class="small">按 page 和 col 读取权重</text>
  <text x="95" y="384" class="tiny">weight_layerN_pageP.mem</text>

  <!-- main 3D array -->
  <g filter="url(#shadow)">
    <polygon class="page2" points="600,145 1240,145 1240,690 600,690"/>
    <polygon class="page1" points="552,182 1192,182 1192,727 552,727"/>
    <polygon class="faceFront" points="505,220 1145,220 1145,765 505,765"/>
    <polygon class="faceTop" points="505,220 600,145 1240,145 1145,220"/>
    <polygon class="faceSide" points="1145,220 1240,145 1240,690 1145,765"/>

    <line x1="665" y1="220" x2="665" y2="765" class="grid"/>
    <line x1="825" y1="220" x2="825" y2="765" class="grid"/>
    <line x1="985" y1="220" x2="985" y2="765" class="grid"/>

    <line x1="505" y1="280" x2="1145" y2="280" class="grid"/>
    <line x1="505" y1="340" x2="1145" y2="340" class="grid"/>
    <line x1="505" y1="400" x2="1145" y2="400" class="grid"/>
    <line x1="505" y1="460" x2="1145" y2="460" class="grid"/>
    <line x1="505" y1="520" x2="1145" y2="520" class="grid"/>
    <line x1="505" y1="580" x2="1145" y2="580" class="grid"/>
    <line x1="505" y1="640" x2="1145" y2="640" class="grid"/>
    <line x1="505" y1="700" x2="1145" y2="700" class="grid"/>

    <line x1="552" y1="182" x2="1192" y2="182" class="grid"/>
    <line x1="600" y1="145" x2="1240" y2="145" class="grid"/>
    <line x1="665" y1="220" x2="760" y2="145" class="grid"/>
    <line x1="825" y1="220" x2="920" y2="145" class="grid"/>
    <line x1="985" y1="220" x2="1080" y2="145" class="grid"/>
    <line x1="1145" y1="280" x2="1240" y2="205" class="grid"/>
    <line x1="1145" y1="340" x2="1240" y2="265" class="grid"/>
    <line x1="1145" y1="400" x2="1240" y2="325" class="grid"/>
    <line x1="1145" y1="460" x2="1240" y2="385" class="grid"/>
    <line x1="1145" y1="520" x2="1240" y2="445" class="grid"/>
    <line x1="1145" y1="580" x2="1240" y2="505" class="grid"/>
    <line x1="1145" y1="640" x2="1240" y2="565" class="grid"/>
    <line x1="1145" y1="700" x2="1240" y2="625" class="grid"/>

    <!-- PE rows, with REG inserted between neighboring columns -->
    <g>
      <rect x="530" y="239" width="110" height="36" class="peCell"/>
      <rect x="690" y="239" width="110" height="36" class="peCellAlt"/>
      <rect x="850" y="239" width="110" height="36" class="peCell"/>
      <rect x="1010" y="239" width="110" height="36" class="peCellAlt"/>
      <text x="585" y="263" text-anchor="middle" class="label">PE0</text>
      <text x="745" y="263" text-anchor="middle" class="label">PE0</text>
      <text x="905" y="263" text-anchor="middle" class="label">PE0</text>
      <text x="1065" y="263" text-anchor="middle" class="label">PE0</text>
      <rect x="648" y="244" width="34" height="26" class="regBox"/>
      <rect x="808" y="244" width="34" height="26" class="regBox"/>
      <rect x="968" y="244" width="34" height="26" class="regBox"/>
      <text x="665" y="262" text-anchor="middle" class="tiny">REG</text>
      <text x="825" y="262" text-anchor="middle" class="tiny">REG</text>
      <text x="985" y="262" text-anchor="middle" class="tiny">REG</text>

      <rect x="530" y="299" width="110" height="36" class="peCellAlt"/>
      <rect x="690" y="299" width="110" height="36" class="peCell"/>
      <rect x="850" y="299" width="110" height="36" class="peCellAlt"/>
      <rect x="1010" y="299" width="110" height="36" class="peCell"/>
      <text x="585" y="323" text-anchor="middle" class="label">PE1</text>
      <text x="745" y="323" text-anchor="middle" class="label">PE1</text>
      <text x="905" y="323" text-anchor="middle" class="label">PE1</text>
      <text x="1065" y="323" text-anchor="middle" class="label">PE1</text>
      <rect x="648" y="304" width="34" height="26" class="regBox"/>
      <rect x="808" y="304" width="34" height="26" class="regBox"/>
      <rect x="968" y="304" width="34" height="26" class="regBox"/>
      <text x="665" y="322" text-anchor="middle" class="tiny">REG</text>
      <text x="825" y="322" text-anchor="middle" class="tiny">REG</text>
      <text x="985" y="322" text-anchor="middle" class="tiny">REG</text>

      <rect x="530" y="359" width="110" height="36" class="peCell"/>
      <rect x="690" y="359" width="110" height="36" class="peCellAlt"/>
      <rect x="850" y="359" width="110" height="36" class="peCell"/>
      <rect x="1010" y="359" width="110" height="36" class="peCellAlt"/>
      <text x="585" y="383" text-anchor="middle" class="label">PE2</text>
      <text x="745" y="383" text-anchor="middle" class="label">PE2</text>
      <text x="905" y="383" text-anchor="middle" class="label">PE2</text>
      <text x="1065" y="383" text-anchor="middle" class="label">PE2</text>
      <rect x="648" y="364" width="34" height="26" class="regBox"/>
      <rect x="808" y="364" width="34" height="26" class="regBox"/>
      <rect x="968" y="364" width="34" height="26" class="regBox"/>
      <text x="665" y="382" text-anchor="middle" class="tiny">REG</text>
      <text x="825" y="382" text-anchor="middle" class="tiny">REG</text>
      <text x="985" y="382" text-anchor="middle" class="tiny">REG</text>

      <text x="585" y="505" text-anchor="middle" class="label">...</text>
      <text x="745" y="505" text-anchor="middle" class="label">...</text>
      <text x="905" y="505" text-anchor="middle" class="label">...</text>
      <text x="1065" y="505" text-anchor="middle" class="label">...</text>

      <rect x="530" y="659" width="110" height="36" class="peCellAlt"/>
      <rect x="690" y="659" width="110" height="36" class="peCell"/>
      <rect x="850" y="659" width="110" height="36" class="peCellAlt"/>
      <rect x="1010" y="659" width="110" height="36" class="peCell"/>
      <text x="585" y="683" text-anchor="middle" class="label">PE8</text>
      <text x="745" y="683" text-anchor="middle" class="label">PE8</text>
      <text x="905" y="683" text-anchor="middle" class="label">PE8</text>
      <text x="1065" y="683" text-anchor="middle" class="label">PE8</text>
      <rect x="648" y="664" width="34" height="26" class="regBox"/>
      <rect x="808" y="664" width="34" height="26" class="regBox"/>
      <rect x="968" y="664" width="34" height="26" class="regBox"/>
      <text x="665" y="682" text-anchor="middle" class="tiny">REG</text>
      <text x="825" y="682" text-anchor="middle" class="tiny">REG</text>
      <text x="985" y="682" text-anchor="middle" class="tiny">REG</text>

      <rect x="530" y="715" width="110" height="34" class="sumBox"/>
      <rect x="690" y="715" width="110" height="34" class="sumBox"/>
      <rect x="850" y="715" width="110" height="34" class="sumBox"/>
      <rect x="1010" y="715" width="110" height="34" class="sumBox"/>
      <text x="585" y="738" text-anchor="middle" class="tiny">output_layer</text>
      <text x="745" y="738" text-anchor="middle" class="tiny">output_layer</text>
      <text x="905" y="738" text-anchor="middle" class="tiny">output_layer</text>
      <text x="1065" y="738" text-anchor="middle" class="tiny">output_layer</text>
    </g>

    <text x="585" y="202" text-anchor="middle" class="label">列0</text>
    <text x="745" y="202" text-anchor="middle" class="label">列1</text>
    <text x="905" y="202" text-anchor="middle" class="label">列2</text>
    <text x="1065" y="202" text-anchor="middle" class="label">列3</text>

    <text x="454" y="492" class="label" transform="rotate(-90 454 492)">page0</text>
    <text x="500" y="165" class="small">page1</text>
    <text x="552" y="130" class="small">page2 / ...</text>
  </g>

  <!-- Axes -->
  <path d="M505 815 L1145 815" class="axis"/>
  <text x="665" y="853" class="label">PE_COL_NUM：并行输出通道列</text>

  <path d="M470 220 L470 765" class="axis"/>
  <text x="405" y="575" class="label" transform="rotate(-90 405 575)">PE_ROW_NUM：KxK 展开的乘加链</text>

  <path d="M1167 790 L1282 700" class="axis"/>
  <text x="1288" y="713" class="label">PE_PAGE_NUM：输入通道分页</text>

  <!-- flows from source blocks -->
  <path d="M342 212 C388 212 430 226 492 258" class="flow"/>
  <text x="352" y="192" class="tiny">窗口数据 window_data[row][page]</text>
  <path d="M342 348 C395 348 430 365 492 390" class="flowDashed"/>
  <text x="110" y="430" class="tiny">权重 W_out[col][row]</text>

  <!-- Output layer -->
  <rect x="1310" y="280" width="390" height="360" class="outBox" filter="url(#shadow)"/>
  <text x="1340" y="320" class="label">输出层 output_layer</text>
  <line x1="1340" y1="342" x2="1670" y2="342" stroke="#7aa58f" stroke-width="1.5"/>
  <text x="1340" y="378" class="small">各输出通道列并行：</text>
  <text x="1360" y="404" class="formula">列0, 列1, 列2, ... 同时计算</text>
  <text x="1340" y="444" class="small">分页分时求和：</text>
  <text x="1360" y="470" class="formula">sum_c += page_y_out[p][c+CYCLE*k]</text>
  <text x="1340" y="510" class="small">随后进行：</text>
  <text x="1360" y="536" class="formula">跨周期输入通道累加</text>
  <text x="1360" y="562" class="formula">+ bias + 右移/四舍五入</text>
  <text x="1360" y="588" class="formula">+ ReLU / 饱和截断</text>
  <text x="1340" y="625" class="label">并行输出：y_out[c]</text>

  <path d="M1148 733 C1220 725 1255 608 1305 585" class="flow"/>
  <path d="M1192 698 C1255 680 1265 474 1305 462" class="flow"/>
  <path d="M1238 661 C1282 630 1268 390 1305 377" class="flow"/>

  <!-- Single-column detail -->
  <rect x="80" y="905" width="1620" height="275" class="noteBox"/>
  <text x="110" y="945" class="label">单个小柱细节：一个 pe_page[p].pe_col[c]</text>
  <text x="110" y="974" class="small">每个 PE 都是完整乘加单元，部分和沿 Y 链逐级传递。</text>

  <text x="116" y="1042" class="formula">Y0 = 0</text>
  <path d="M178 1036 L230 1036" class="flow"/>

  <rect x="232" y="995" width="190" height="95" class="macBox"/>
  <text x="327" y="1023" text-anchor="middle" class="label">PE0 / 乘加</text>
  <circle cx="292" cy="1054" r="18" class="mulCircle"/>
  <text x="292" y="1060" text-anchor="middle" class="label">x</text>
  <circle cx="360" cy="1054" r="18" class="addCircle"/>
  <text x="360" y="1060" text-anchor="middle" class="label">+</text>
  <path d="M310 1054 L340 1054" class="flow"/>
  <text x="265" y="1080" class="tiny">D0 * W0</text>
  <text x="255" y="1118" class="formula">Y1 = Y0 + D0*W0</text>
  <path d="M422 1036 L488 1036" class="flow"/>
  <text x="446" y="1025" class="formula">Y1</text>

  <rect x="490" y="995" width="190" height="95" class="macBox"/>
  <text x="585" y="1023" text-anchor="middle" class="label">PE1 / 乘加</text>
  <circle cx="550" cy="1054" r="18" class="mulCircle"/>
  <text x="550" y="1060" text-anchor="middle" class="label">x</text>
  <circle cx="618" cy="1054" r="18" class="addCircle"/>
  <text x="618" y="1060" text-anchor="middle" class="label">+</text>
  <path d="M568 1054 L598 1054" class="flow"/>
  <text x="523" y="1080" class="tiny">D1 * W1</text>
  <text x="513" y="1118" class="formula">Y2 = Y1 + D1*W1</text>
  <path d="M680 1036 L746 1036" class="flow"/>
  <text x="704" y="1025" class="formula">Y2</text>

  <text x="764" y="1042" class="label">...</text>
  <path d="M800 1036 L860 1036" class="flow"/>

  <rect x="862" y="995" width="190" height="95" class="macBox"/>
  <text x="957" y="1023" text-anchor="middle" class="label">PE8 / 乘加</text>
  <circle cx="922" cy="1054" r="18" class="mulCircle"/>
  <text x="922" y="1060" text-anchor="middle" class="label">x</text>
  <circle cx="990" cy="1054" r="18" class="addCircle"/>
  <text x="990" y="1060" text-anchor="middle" class="label">+</text>
  <path d="M940 1054 L970 1054" class="flow"/>
  <text x="895" y="1080" class="tiny">D8 * W8</text>
  <text x="885" y="1118" class="formula">Y9 = Y8 + D8*W8</text>
  <path d="M1052 1036 L1128 1036" class="flow"/>
  <text x="1142" y="1042" class="formula">page_y_out[p][c]</text>

  <text x="116" y="1150" class="formula">PEj: Y[j+1] = Y[j] + D[j] * W[j]</text>
  <text x="545" y="1150" class="formula">partial_sum[p][c] = Σ_k window[p][k] * weight[p][c][k]</text>
</svg>
